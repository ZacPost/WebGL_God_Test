<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🗺️ God Test Map</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        * { user-select: none; -webkit-user-select: none; }

        #joystick-container {
            position: fixed;
            bottom: 50px;
            left: 50px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #joystick-knob {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffdd44, #f5a623);
            box-shadow: 0 4px 15px rgba(255,200,0,0.4);
            touch-action: none;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #1a1a2e;
            font-weight: bold;
            user-select: none;
            transition: none;
        }

        #jump-button {
            position: fixed;
            bottom: 50px;
            right: 50px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(68, 200, 255, 0.3);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(68, 200, 255, 0.5);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            font-family: system-ui, sans-serif;
            cursor: pointer;
            transition: 0.1s;
        }
        #jump-button:active {
            transform: scale(0.9);
            background: rgba(68, 200, 255, 0.6);
        }

        #camera-view-button {
            position: fixed;
            bottom: 210px;
            right: 50px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 200, 50, 0.25);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 200, 50, 0.4);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            font-family: system-ui, sans-serif;
            cursor: pointer;
            transition: 0.1s;
        }
        #camera-view-button:active {
            transform: scale(0.9);
            background: rgba(255, 200, 50, 0.5);
        }

        #hud {
            position: fixed;
            bottom: 220px;
            left: 50px;
            color: white;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 10;
            pointer-events: none;
        }
        #hud span { color: #ffdd44; }

        #zoom-indicator {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 10;
            pointer-events: none;
            display: none;
        }

#system-info-toggle {
    position: fixed;
    top: 50px;
    right: 50px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(100, 200, 255, 0.3);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(100, 200, 255, 0.5);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
#system-info-toggle:hover {
    background: rgba(100, 200, 255, 0.5);
}

#info-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 380px;
    height: 100vh;
    background: radial-gradient(ellipse at top right, rgba(255,221,68,0.3), rgba(0, 0, 0, 0.9));
    backdrop-filter: blur(12px);
    border-left: 2px solid rgba(255,221,68,0.4);
    padding: 20px;
    z-index: 45;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.8;
    box-shadow: -8px 0 32px rgba(255,200,0,0.2), -20px 0 60px rgba(0, 0, 0, 0.8);
    overflow-y: auto;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
    pointer-events: none;
    opacity: 0;
    transform: translateX(100%);
}

#info-panel.open {
    pointer-events: all;
    opacity: 1;
    transform: translateX(0);
}

#info-panel h2 {
    margin: 0 0 16px 0;
    color: #ffdd44;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    border-bottom: 2px solid rgba(255,221,68,0.5);
    padding-bottom: 12px;
    text-shadow: 0 0 20px rgba(255,221,68,0.3);
}

#info-panel .info-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

#info-panel .label {
    color: #ffdd44;
    min-width: 100px;
    text-shadow: 0 0 10px rgba(255,221,68,0.2);
}

#info-panel .value {
    color: #ffdd44;
    text-align: right;
    flex: 1;
    margin-left: 16px;
    word-break: break-word;
    font-weight: bold;
}

        @media (max-width: 600px) {
            #joystick-container { width: 110px; height: 110px; bottom: 25px; left: 25px; }
            #joystick-knob { width: 50px; height: 50px; font-size: 22px; }
            #jump-button { width: 90px; height: 90px; bottom: 25px; right: 25px; font-size: 18px; }
            #camera-view-button { width: 70px; height: 70px; bottom: 130px; right: 25px; font-size: 22px; }
            #hud { bottom: 160px; left: 25px; font-size: 11px; padding: 8px 14px; }
        }
    </style>
</head>
<body>

    <div id="joystick-container">
        <div id="joystick-knob">▲</div>
    </div>

    <div id="jump-button">⬆ JUMP</div>

    <div id="camera-view-button">🎥</div>

    <div id="hud">🏃 <span id="posX">0.0</span> , <span id="posZ">0.0</span> &nbsp;|&nbsp; <span id="viewMode">3rd</span></div>

    <div id="zoom-indicator">🔍 Zoom</div>

    <div id="system-info-toggle">ℹ️</div>

    <div id="info-panel">
        <h2>System Info</h2>
        <div class="info-line">
            <span class="label">GPU:</span>
            <span class="value" id="gpu-info">Loading...</span>
        </div>
        <div class="info-line">
            <span class="label">WebGL:</span>
            <span class="value" id="webgl-info">Loading...</span>
        </div>
        <div class="info-line">
            <span class="label">CPU:</span>
            <span class="value" id="cpu-name">Loading...</span>
        </div>
        <div class="info-line">
            <span class="label">Cores:</span>
            <span class="value" id="cpu-cores">Loading...</span>
        </div>
        <div class="info-line">
            <span class="label">FPS:</span>
            <span class="value" id="fps-display">0</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================
        // SCENA, CAMERA, RENDERER
        // ============================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a90d9);
        scene.fog = new THREE.Fog(0x4a90d9, 35, 70);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.bias = 0.0001;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ============================
        // SYSTEM INFO DISPLAY
        // ============================
        const canvas = renderer.domElement;
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
        
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        const gpuName = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Unknown';
        document.getElementById('gpu-info').textContent = gpuName;
        
        const webglVersion = gl.getParameter(gl.VERSION);
        document.getElementById('webgl-info').textContent = webglVersion;
        
        const cpuCores = navigator.hardwareConcurrency || 'Unknown';
        document.getElementById('cpu-cores').textContent = cpuCores + ' cores';
        
        let cpuName = 'Unknown';
        const userAgent = navigator.userAgent;
        if (userAgent.includes('Win')) cpuName = 'Windows (Intel/AMD)';
        else if (userAgent.includes('Mac')) cpuName = 'macOS (Apple Silicon)';
        else if (userAgent.includes('Linux')) cpuName = 'Linux (Various)';
        else if (userAgent.includes('Android')) cpuName = 'Android ARM';
        document.getElementById('cpu-name').textContent = cpuName;

        // ============================
        // FPS COUNTER
        // ============================
        let frameCount = 0;
        let lastTime = Date.now();
        let fps = 0;

        // ============================
        // LUCI (con ombre realistiche)
        // ============================
        scene.add(new THREE.AmbientLight(0x88ccff, 0.4));
        
        const sunLight = new THREE.DirectionalLight(0xffeedd, 2.0);
        sunLight.position.set(15, 25, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);
        
        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-10, 15, -10);
        scene.add(fillLight);

        // ============================
        // SOLE GIALLO VIVO CON RAGGI (FOG DISABLED)
        // ============================
        function createSun() {
            const group = new THREE.Group();
            
            const sunMat = new THREE.MeshStandardMaterial({
                color: 0xffdd00,
                emissive: 0xff8800,
                emissiveIntensity: 6.0,
                roughness: 0.0,
                metalness: 0.0,
                fog: false,
            });
            const sun = new THREE.Mesh(new THREE.SphereGeometry(6.0, 32, 32), sunMat);
            sun.position.set(0, 0, 0);
            group.add(sun);
            
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xff8800,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide,
                fog: false,
            });
            const glow = new THREE.Mesh(new THREE.SphereGeometry(8.0, 32, 32), glowMat);
            glow.position.set(0, 0, 0);
            group.add(glow);
            
            const glowMat2 = new THREE.MeshBasicMaterial({
                color: 0xff6600,
                transparent: true,
                opacity: 0.08,
                side: THREE.BackSide,
                fog: false,
            });
            const glow2 = new THREE.Mesh(new THREE.SphereGeometry(10.0, 32, 32), glowMat2);
            glow2.position.set(0, 0, 0);
            group.add(glow2);
            
            const rayCount = 150;
            const rayPos = new Float32Array(rayCount * 3);
            const raySizes = new Float32Array(rayCount);
            for (let i = 0; i < rayCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 6.5 + Math.random() * 4.0;
                rayPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
                rayPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
                rayPos[i*3+2] = Math.cos(phi) * r;
                raySizes[i] = 0.1 + Math.random() * 0.3;
            }
            const rayGeo = new THREE.BufferGeometry();
            rayGeo.setAttribute('position', new THREE.Float32BufferAttribute(rayPos, 3));
            rayGeo.setAttribute('size', new THREE.Float32BufferAttribute(raySizes, 1));
            const rayMat = new THREE.PointsMaterial({
                color: 0xffaa00,
                size: 0.25,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
                fog: false,
            });
            const rays = new THREE.Points(rayGeo, rayMat);
            group.add(rays);
            
            group.position.set(18, 30, -35);
            return group;
        }

        const sun = createSun();
        scene.add(sun);

        // ============================
        // NUVOLE
        // ============================
        function createCloud(x, y, z, scale = 1) {
            const group = new THREE.Group();
            const cloudMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.75,
                roughness: 1,
                metalness: 0
            });
            
            const positions = [
                [0, 0, 0, 0.5],
                [-0.5, 0.05, 0, 0.35],
                [0.5, 0.05, 0, 0.35],
                [-0.25, 0.12, 0, 0.3],
                [0.25, 0.12, 0, 0.3],
                [0, -0.08, 0, 0.4]
            ];
            
            for (const pos of positions) {
                const sphere = new THREE.Mesh(new THREE.SphereGeometry(pos[3] * scale, 8, 8), cloudMat);
                sphere.position.set(pos[0] * scale, pos[1] * scale, pos[2] * scale);
                sphere.scale.set(1, 0.6, 0.8);
                group.add(sphere);
            }
            
            group.position.set(x, y, z);
            return group;
        }

        const clouds = [
            createCloud(-14, 9, -12, 3.0),
            createCloud(12, 10, -14, 2.5),
            createCloud(-10, 11, 12, 2.8),
            createCloud(16, 8, 10, 2.2),
            createCloud(-18, 10, 6, 2.5),
            createCloud(0, 12, -18, 3.5),
            createCloud(20, 9, -8, 2.0),
            createCloud(-20, 11, -10, 2.5),
            createCloud(6, 13, 16, 2.2),
            createCloud(-6, 12, -16, 2.5),
        ];
        for (const cloud of clouds) {
            scene.add(cloud);
        }

        // ============================
        // UI RESPONSIVE RESIZER
        // ============================
        function resizeUI() {
            const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const isLandscape = width > height;
            const isMobile = width < 768;
            
            let scale;
            let panelWidth;
            
            if (isMobile) {
                if (isLandscape) {
                    scale = Math.max(0.25, Math.min(0.45, width / 900));
                    panelWidth = Math.min(140, Math.max(110, width * 0.30));
                } else {
                    scale = Math.max(0.25, Math.min(0.45, width / 600));
                    panelWidth = Math.min(100, Math.max(80, width * 0.22));
                }
            } else {
                scale = Math.max(0.50, Math.min(1.20, width / 1920));
                panelWidth = Math.min(380, Math.max(280, width * 0.30));
            }
            
            document.documentElement.style.setProperty('--panel-width', panelWidth + 'px');
            
            const joystickSize = 160 * scale;
            const joystickKnobSize = 70 * scale;
            const jumpSize = 120 * scale;
            const cameraSize = 80 * scale;
            const toggleSize = 50 * scale;
            const margin = 40 * scale;
            
            const joystick = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            if (joystick) {
                joystick.style.width = joystickSize + 'px';
                joystick.style.height = joystickSize + 'px';
                joystick.style.bottom = margin + 'px';
                joystick.style.left = margin + 'px';
            }
            if (knob) {
                knob.style.width = joystickKnobSize + 'px';
                knob.style.height = joystickKnobSize + 'px';
                knob.style.fontSize = (32 * scale) + 'px';
            }
            
            const jumpBtn = document.getElementById('jump-button');
            if (jumpBtn) {
                jumpBtn.style.width = jumpSize + 'px';
                jumpBtn.style.height = jumpSize + 'px';
                jumpBtn.style.fontSize = (24 * scale) + 'px';
                jumpBtn.style.bottom = margin + 'px';
                jumpBtn.style.right = margin + 'px';
            }
            
            const camBtn = document.getElementById('camera-view-button');
            if (camBtn) {
                camBtn.style.width = cameraSize + 'px';
                camBtn.style.height = cameraSize + 'px';
                camBtn.style.fontSize = (28 * scale) + 'px';
                camBtn.style.bottom = (margin + jumpSize + 20 * scale) + 'px';
                camBtn.style.right = margin + 'px';
            }
            
            const toggle = document.getElementById('system-info-toggle');
            if (toggle) {
                toggle.style.width = toggleSize + 'px';
                toggle.style.height = toggleSize + 'px';
                toggle.style.fontSize = (24 * scale) + 'px';
                toggle.style.top = margin + 'px';
                toggle.style.right = margin + 'px';
            }
            
            const hud = document.getElementById('hud');
            if (hud) {
                hud.style.fontSize = (14 * scale) + 'px';
                hud.style.padding = (12 * scale) + 'px ' + (18 * scale) + 'px';
                hud.style.bottom = (margin + jumpSize + 60 * scale) + 'px';
                hud.style.left = margin + 'px';
            }
            
            const panel = document.getElementById('info-panel');
            if (panel) {
                panel.style.fontSize = (14 * scale) + 'px';
                panel.style.padding = (20 * scale) + 'px';
            }
            
            updatePanelWidth();
        }

        // ============================
        // SYSTEM INFO TOGGLE
        // ============================
        const systemInfoToggle = document.getElementById('system-info-toggle');
        const infoPanel = document.getElementById('info-panel');
        let panelWidth = 380;

        function updatePanelWidth() {
            const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const isLandscape = width > height;
            const isMobile = width < 768;
            
            let panelW;
            let buttonOffset = 16;
            let panelPadding = 12;
            let panelFontSize = 10;
            let linePadding = 3;
            let titleSize = 13;
            let labelMinWidth = 60;
            let valueMargin = 6;
            
            if (isMobile) {
                if (isLandscape) {
                    panelW = Math.min(180, Math.max(140, width * 0.35));
                    buttonOffset = 18;
                    panelPadding = 12;
                    panelFontSize = 10;
                    linePadding = 3;
                    titleSize = 13;
                    labelMinWidth = 60;
                    valueMargin = 6;
                } else {
                    panelW = Math.min(200, Math.max(160, width * 0.50));
                    buttonOffset = 25;
                    panelPadding = 12;
                    panelFontSize = 10;
                    linePadding = 3;
                    titleSize = 13;
                    labelMinWidth = 55;
                    valueMargin = 5;
                }
            } else {
                panelW = Math.min(380, Math.max(280, width * 0.30));
                buttonOffset = 20;
                panelPadding = 20;
                panelFontSize = 14;
                linePadding = 6;
                titleSize = 18;
                labelMinWidth = 100;
                valueMargin = 16;
            }
            
            panelWidth = panelW;
            
            infoPanel.style.width = panelWidth + 'px';
            infoPanel.style.padding = panelPadding + 'px';
            infoPanel.style.fontSize = panelFontSize + 'px';
            infoPanel.style.minWidth = 'unset';
            
            const title = document.querySelector('#info-panel h2');
            if (title) {
                title.style.fontSize = titleSize + 'px';
                title.style.paddingBottom = (panelPadding * 0.4) + 'px';
                title.style.marginBottom = (panelPadding * 0.4) + 'px';
            }
            
            const infoLines = document.querySelectorAll('#info-panel .info-line');
            infoLines.forEach(line => {
                line.style.padding = linePadding + 'px 0';
                line.style.marginBottom = '1px';
                line.style.borderBottom = '1px solid rgba(255,255,255,0.06)';
            });
            
            const labels = document.querySelectorAll('#info-panel .label');
            labels.forEach(label => {
                label.style.minWidth = labelMinWidth + 'px';
                label.style.fontSize = panelFontSize + 'px';
            });
            
            const values = document.querySelectorAll('#info-panel .value');
            values.forEach(value => {
                value.style.marginLeft = valueMargin + 'px';
                value.style.fontSize = panelFontSize + 'px';
                value.style.wordBreak = 'break-word';
            });
            
            if (infoPanel.classList.contains('open')) {
                systemInfoToggle.style.transform = 'translateX(-' + (panelWidth + buttonOffset) + 'px)';
            } else {
                systemInfoToggle.style.transform = 'translateX(0)';
            }
        }

        systemInfoToggle.addEventListener('click', () => {
            infoPanel.classList.toggle('open');
            if (infoPanel.classList.contains('open')) {
                systemInfoToggle.style.transform = 'translateX(-' + (panelWidth + 20) + 'px)';
            } else {
                systemInfoToggle.style.transform = 'translateX(0)';
            }
        });

        document.addEventListener('click', (e) => {
            const target = e.target;
            if (!target.closest('#info-panel') && !target.closest('#system-info-toggle')) {
                infoPanel.classList.remove('open');
                systemInfoToggle.style.transform = 'translateX(0)';
            }
        });

        // ============================
        // RESIZE EVENTI
        // ============================
        setTimeout(resizeUI, 100);
        window.addEventListener('resize', resizeUI);
        
        let orientationTimeout;
        window.addEventListener('orientationchange', () => {
            clearTimeout(orientationTimeout);
            orientationTimeout = setTimeout(() => {
                resizeUI();
            }, 300);
        });

        // ============================
        // PRATO
        // ============================
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6aad4a';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 18000; i++) {
                const x = Math.random() * 512, y = Math.random() * 512;
                const h = 3 + Math.random() * 12;
                const shade = 60 + Math.random() * 100;
                ctx.strokeStyle = `rgb(${shade-20}, ${shade+60}, ${shade-50})`;

class SoundManager {
    constructor() {
        this.audioCtx = null;
        this.isWalking = false;
        this.walkInterval = null;
        this.walkVolume = 7;       // Volume camminata (perfetto)
        this.jumpVolume = 0.2;     // Volume salto (perfetto)
        this.stepIndex = 0;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        try {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.audioCtx.state === 'suspended') {
                this.audioCtx.resume();
            }
            this.initialized = true;
            console.log('✅ Audio context inizializzato');
        } catch(e) {
            console.log('Audio non disponibile');
        }
    }

    playWalkSound() {
        if (!this.audioCtx) return;
        try {
            this.stepIndex = (this.stepIndex + 1) % 2;
            
            const bufferSize = this.audioCtx.sampleRate * 0.05;
            const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                const env = Math.exp(-i / (bufferSize * 0.2));
                const noise1 = (Math.random() * 2 - 1) * 0.8;
                const noise2 = Math.sin(i * 0.08) * (Math.random() - 0.5) * 0.6;
                data[i] = (noise1 * 0.5 + noise2 * 0.5) * env * 0.9;
            }
            
            const noise = this.audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const filter = this.audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 400 + Math.random() * 200;
            filter.Q.value = 0.7;
            
            const gain = this.audioCtx.createGain();
            gain.gain.setValueAtTime(this.walkVolume * 2.0, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.05);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.audioCtx.destination);
            
            noise.start();
            noise.stop(this.audioCtx.currentTime + 0.05);
            
        } catch(e) {}
    }

    playJumpSound() {
        if (!this.audioCtx) return;
        try {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, this.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, this.audioCtx.currentTime + 0.15);
            
            gain.gain.setValueAtTime(this.jumpVolume * 1.5, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.15);
            
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            
            osc.start();
            osc.stop(this.audioCtx.currentTime + 0.15);
            
            const bufferSize = this.audioCtx.sampleRate * 0.08;
            const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                const env = Math.exp(-i / (bufferSize * 0.3));
                data[i] = (Math.random() * 2 - 1) * 0.5 * env;
            }
            
            const noise = this.audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const filter = this.audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 800;
            filter.Q.value = 0.5;
            
            const gain2 = this.audioCtx.createGain();
            gain2.gain.setValueAtTime(this.jumpVolume * 0.4, this.audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.08);
            
            noise.connect(filter);
            filter.connect(gain2);
            gain2.connect(this.audioCtx.destination);
            
            noise.start();
            noise.stop(this.audioCtx.currentTime + 0.08);
            
        } catch(e) {}
    }

    startWalking() {
        if (this.isWalking) return;
        this.isWalking = true;
        this.walkInterval = setInterval(() => {
            if (this.isWalking) {
                this.playWalkSound();
            }
        }, 280);
    }

    stopWalking() {
        this.isWalking = false;
        if (this.walkInterval) {
            clearInterval(this.walkInterval);
            this.walkInterval = null;
        }
    }
}

        const cameraViewBtn = document.getElementById('camera-view-button');

        let joyX = 0, joyY = 0;
        let joyActive = false;
        let joystickTouchId = null;

        function updateJoystick(clientX, clientY) {
            const rect = joystickEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = (clientX - cx) / (rect.width / 2);
            let dy = (clientY - cy) / (rect.height / 2);
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 1) { dx /= dist; dy /= dist; }
            joyX = dx;
            joyY = dy;
            knobEl.style.transform = `translate(${dx*20}px, ${dy*20}px)`;
        }

        function resetJoystick() {
            joyX = 0; joyY = 0;
            joyActive = false;
            joystickTouchId = null;
            knobEl.style.transform = 'translate(0px, 0px)';
        }

        joystickEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.changedTouches[0];
            joystickTouchId = t.identifier;
            joyActive = true;
            updateJoystick(t.clientX, t.clientY);
        }, { passive: false });

        joystickEl.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joyActive) return;
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    updateJoystick(t.clientX, t.clientY);
                }
            }
        }, { passive: false });

        joystickEl.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {

                }
            }

        // ============================
        // CAMERA TOUCH
        // ============================
        const cameraTouches = new Map();
        let lastPinchDist = 0;
        let isPinching = false;

        function isTouchOnUI(touch) {
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!el) return false;
            return el.closest('#joystick-container') || 
                   el.closest('#jump-button') || 
                   el.closest('#camera-view-button');
        }

        document.addEventListener('touchstart', (e) => {
            let touchOnUI = false;
            for (const t of e.changedTouches) {
                if (isTouchOnUI(t)) touchOnUI = true;
            }
            if (touchOnUI && cameraTouches.size > 0) return;
            if (touchOnUI) return;
            if (e.touches.length === 2) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                if (!isTouchOnUI(t1) && !isTouchOnUI(t2)) {
                    const dx = t1.clientX - t2.clientX;
                    const dy = t1.clientY - t2.clientY;
                    lastPinchDist = Math.sqrt(dx*dx + dy*dy);
                    isPinching = true;
                }
            }
            for (const t of e.changedTouches) {
                if (isTouchOnUI(t)) continue;
                cameraTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && isPinching) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                if (!isTouchOnUI(t1) && !isTouchOnUI(t2)) {
                    const dx = t1.clientX - t2.clientX;
                    const dy = t1.clientY - t2.clientY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const delta = lastPinchDist - dist;
                    if (lastPinchDist > 0) {
                        camDist += delta * 0.02;
                        camDist = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camDist));
                        if (isFirstPerson) camDist = 0.5;
                        showZoomIndicator();
                    }
                    lastPinchDist = dist;
                } else {
                    isPinching = false;
                    lastPinchDist = 0;
                }
            }
            for (const t of e.changedTouches) {
                if (isTouchOnUI(t)) continue;
                if (!cameraTouches.has(t.identifier)) continue;
                const last = cameraTouches.get(t.identifier);
                const dx = t.clientX - last.x;
                const dy = t.clientY - last.y;
                cameraAngle -= dx * 0.01;
                cameraPitch += dy * 0.01;
                cameraPitch = Math.max(-0.8, Math.min(1.2, cameraPitch));
                cameraTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                isPinching = false;
                lastPinchDist = 0;
            }
            for (const t of e.changedTouches) {
                if (isTouchOnUI(t)) continue;
                cameraTouches.delete(t.identifier);
            }
        }, { passive: true });

        document.addEventListener('touchcancel', (e) => {

                        pos.x = Math.sign(pos.x) * (halfSize + playerRadius);
                    } else {
                        pos.z = Math.sign(pos.z) * (halfSize + playerRadius);
                    }
                    return true;
                }
            }
            return false;
